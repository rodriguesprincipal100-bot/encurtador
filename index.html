<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Encurtador</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      font-family: Arial, sans-serif;
      color: white;
    }

    .box {
      width: 90%;
      max-width: 500px;
      padding: 30px;
      background: #1f2937;
      border-radius: 20px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      margin: 15px 0;
      font-size: 16px;
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
    }

    #resultado {
      margin-top: 20px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🔗 Meu Encurtador</h1>

    <p>Digite o link que deseja encurtar:</p>

    <input
      type="url"
      id="link"
      placeholder="https://exemplo.com"
    >

    <button onclick="encurtar()">
      Criar link curto
    </button>

    <div id="resultado"></div>
  </div>

  <script>
    function encurtar() {
      const link = document.getElementById("link").value.trim();

      if (!link) {
        alert("Digite um link primeiro!");
        return;
      }

      const codigo = Math.random()
        .toString(36)
        .substring(2, 8);

      const linkCurto =
        window.location.origin +
        window.location.pathname +
        "#" +
        codigo;

      document.getElementById("resultado").innerHTML =
        "<p>Seu link curto:</p>" +
        "<a href='" + linkCurto + "' style='color:#60a5fa'>" +
        linkCurto +
        "</a>";
    }
  </script>

</body>
</html>
